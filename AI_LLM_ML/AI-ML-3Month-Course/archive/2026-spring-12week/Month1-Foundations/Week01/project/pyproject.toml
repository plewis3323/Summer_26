[project]
name = "week01"
version = "0.1.0"
description = "Week 01 — Python scientific stack, ML mindset, reproducibility"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "uproot>=5.3",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week01"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Scaffolds: imports and `pass` placeholders are there for the reader to fill in.
"run.py" = ["F401"]
"tests/*" = ["F401"]
"src/week01/center.py" = ["F401"]
"notebooks/*.ipynb" = ["F401", "PIE790", "E402", "F841"]
